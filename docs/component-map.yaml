version: 2
components:
  composition:
    path: backend/src/cce/bootstrap.py
    owns: [repositories, services, index_provider, model_provider, graphs, job_runner]
  source_ingestion:
    path: backend/src/cce/ingestion/source_graph.py
    owns: [inventory_diff, item_fanout, domain_detection, scoped_extraction, completion_gate]
    dependencies: [sources, grounding, ingestion_repository, agentic_plane, llm]
  jobs:
    path: backend/src/cce/ingestion/job_runner.py
    owns: [durable_job_execution, lease_renewal, restart_recovery]
  governance:
    path: backend/src/cce/governance/service.py
    owns: [proposal_edit, approval, rejection, review_audit]
    persistence: backend/src/cce/persistence/postgres/governance_repository.py
  packages:
    path: backend/src/cce/context_packages/builder.py
    owns: [validation, full_snapshot, immutable_revisions, atomic_activation, relational_projection]
  query:
    path: backend/src/cce/runtime/orchestrator.py
    owns: [intent, domain_routing, active_package, parallel_branches, governed_retrieval, proof, traces]
  sql:
    path: backend/src/cce/runtime/sql_pipeline.py
    owns: [generation, parse, scope_validation, guard, execution, error_analysis, retry_budget]
  adapters:
    paths: [backend/src/cce/http/app.py, backend/src/cce/rpc/services, backend/src/cce/mcp/tools/query.py]
    owns: [transport_mapping]
  frontend_mock:
    paths: [frontend, backend/api]
    status: development_only
    owns: [mock_ui_state]
