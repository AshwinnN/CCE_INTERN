version: 1
truth_order:
  - source_code
  - architecture_and_adrs
  - vision_and_mvp

modules:
  transports:
    path: backend/src/cce/rpc
    purpose: >
      Expose protobuf-first gRPC handlers; FastAPI is a sibling thin adapter over the same Application.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/rpc/server.py:create_server
        - backend/src/cce/http/app.py:create_app
      important_components:
        - backend/src/cce/rpc/services/health_service.py:HealthService
        - backend/src/cce/rpc/services/source_service.py:SourceRPCService
        - backend/src/cce/rpc/services/query_service.py:QueryRPCService
        - backend/src/cce/rpc/services/retrieval_service.py:RetrievalRPCService
        - backend/src/cce/http/app.py:POST /retrieve
      owns:
        - transport mapping
        - server registration
    inputs:
      - backend/proto/cce/v1/*.proto
    outputs:
      - gRPC responses
      - JSON responses
    depends_on:
      - bootstrap/Application
      - source service
      - runtime service
      - retrieval service
      - governance service
      - context package service
    used_by:
      - external clients
    invariants:
      enforced:
        - gRPC and HTTP delegate to shared Application objects
        - source ingestion triggers call the shared source service
        - raw retrieval transports call the shared RetrievalService
      required_but_not_fully_enforced:
        - authentication and authorization before service execution
    known_gaps:
      - Governance/package/query transports delegate to placeholder services.
      - Raw retrieval is not authenticated or governed and intentionally does not use QueryService.
      - gRPC auth/authz interceptors are empty and not registered.
    related_docs:
      - backend/src/cce/rpc/AGENTS.md
      - backend/src/cce/http/AGENTS.md
      - docs/decisions/ADR-001-grpc-protobuf.md
      - docs/decisions/ADR-004-json-adapter.md

  connectors:
    path: backend/src/cce/connectors
    purpose: >
      Provide provider-neutral connector contracts, routing/observation and provider access.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/connectors/agent.py:ConnectorAgent.handle
        - backend/src/cce/connectors/factory.py:ConnectorFactory.create
      important_components:
        - backend/src/cce/connectors/structured/snowflake/connector.py:SnowflakeConnector
        - backend/src/cce/connectors/unstructured/local_fs/connector.py:LocalFileSystemConnector
        - backend/src/cce/connectors/unstructured/azure_blob/connector.py:AzureBlobSource
        - backend/src/cce/connectors/fetch.py:snowflake_schema_fetcher
        - backend/src/cce/connectors/fetch.py:azure_blob_fetcher
        - backend/src/cce/connectors/registry.py:StubAdapterRegistryProvider
      owns:
        - provider connection
        - source discovery/read
        - source-side read-only verification where implemented
        - source change-event generation
    inputs:
      - ConnectorRequest
      - credential references
    outputs:
      - ConnectorResponse
      - source change events
      - schema cards/raw bytes
    depends_on:
      - security.credentials
      - provider SDKs
    used_by:
      - ingestion.service
      - ingestion.orchestrator
    invariants:
      enforced:
        - Snowflake rejects credentials when a live write probe succeeds.
      required_but_not_fully_enforced:
        - all registry READY adapters are executable
        - durable change checkpoints
        - provider-proven entitlement capture
    known_gaps:
      - Structured factory implements only Snowflake despite broader READY registry entries.
      - Observation provider listers are caller-injected and observation checkpoint/dedup stores are in-memory.
      - Azure Blob has both a SourceConnector path and an older fetch-helper path.
    related_docs:
      - backend/src/cce/connectors/AGENTS.md

  ingestion:
    path: backend/src/cce/ingestion
    purpose: >
      Convert source change events into canonical normalized content, persist structured metadata,
      call DLP hooks, emit downstream, and checkpoint processing.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/ingestion/service.py:run_pipeline
        - backend/src/cce/ingestion/orchestrator.py:run_ingestion
      important_components:
        - backend/src/cce/ingestion/orchestrator.py:build_ingestion_workflow
        - backend/src/cce/ingestion/parsers/factory.py:ParserFactory
        - backend/src/cce/ingestion/parsers/pdf_text.py:PdfTextParser
        - backend/src/cce/ingestion/parsers/docx.py:DocxParser
        - backend/src/cce/ingestion/parsers/pptx.py:PptxParser
        - backend/src/cce/ingestion/normalizers/document.py:normalize_to_canonical
        - backend/src/cce/ingestion/checkpoint.py:IngestionCheckpointStore
      owns:
        - ingestion orchestration
        - parsing and normalization
        - structured metadata snapshot write
        - processing checkpoint
    inputs:
      - source change events
      - connector handles
    outputs:
      - CanonicalDocument-like payload
      - structured metadata snapshots
      - SDK HTTP payload or dry-run
      - ingestion checkpoint
    depends_on:
      - connectors
      - persistence
      - security.dlp
      - pypdfium2 for PDF text extraction
      - python-docx for Word document extraction
      - python-pptx for PowerPoint extraction
    used_by:
      - source service
      - callable ingestion service
    invariants:
      enforced:
        - structured snapshots are written as new snapshot IDs
        - parser selection is MIME-based through ParserFactory
        - PDF, DOCX and PPTX parsers are registered independently so one missing dependency degrades only its own format
      required_but_not_fully_enforced:
        - real DLP/PII redaction
        - entitlement capture
        - proposals are created instead of directly serving content
        - durable graph write
    known_gaps:
      - DLP implementation is a no-op stub.
      - CCE_SDK_ENDPOINT absence is treated as successful dry-run emission.
      - No governance proposal creation follows ingestion.
      - PDF parsing is text-block extraction with best-effort OCR fallback, not table/layout extraction.
    related_docs:
      - backend/src/cce/ingestion/AGENTS.md
      - backend/src/cce/ingestion/FLOW.md

  sources:
    path: backend/src/cce/sources
    purpose: >
      Compose registered source configuration, provider connectors, ingestion
      orchestration and ingestion-run state for gRPC and HTTP source operations.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/sources/service.py:SourceService
      important_components:
        - backend/src/cce/sources/service.py:SourceService.register_source
        - backend/src/cce/sources/service.py:SourceService.list_sources
        - backend/src/cce/sources/service.py:SourceService.test_connection
        - backend/src/cce/sources/service.py:SourceService.trigger_ingestion
        - backend/src/cce/sources/service.py:SourceService.get_ingestion_status
      owns:
        - source service orchestration
        - ingestion run lifecycle
    inputs:
      - registered source configuration
      - credential references
    outputs:
      - source operation status
      - ingestion run status
      - downstream index payloads through the AgenticPlane boundary
    depends_on:
      - connectors
      - ingestion.orchestrator
      - persistence
      - integrations.agentic_plane
    used_by:
      - gRPC source service
      - HTTP source endpoints
    invariants:
      enforced:
        - transports share one source service path
        - ingestion is emitted through the configured AgenticPlane boundary
      required_but_not_fully_enforced:
        - auth/authz before source administration
        - provider breadth beyond Snowflake, Azure Blob and local-fs
    known_gaps:
      - No scheduling or continuous source polling loop.
      - No governance proposal creation after indexing.
    related_docs:
      - docs/architecture/ingestion-flow.md

  persistence:
    path: backend/src/cce/persistence
    purpose: >
      Persist CCE-owned registration and structured metadata state in PostgreSQL.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/persistence/postgres/metadata_repository.py:PostgreSQLMetadataRepository
        - backend/src/cce/persistence/postgres/source_repository.py:PostgresSourceRepository
        - backend/src/cce/persistence/postgres/migrations.py:initialize_control_postgres
      important_components:
        - backend/src/cce/persistence/ports.py:MetadataRepository
        - backend/migrations/cce_control/001_registry.sql
        - backend/migrations/cce_control/002_metadata.sql
        - backend/migrations/cce_control/007_source_config.sql
        - backend/migrations/cce_control/008_local_index.sql
        - backend/migrations/cce_control/011_agentic_plane_refs.sql
      owns:
        - cce_control persistence contracts and implementations
    inputs:
      - source registration
      - schema snapshots/tables/columns/constraints/relationships
      - ingestion run state
      - local index chunks
      - AgenticPlane document-to-memory references
    outputs:
      - durable PostgreSQL state
    depends_on:
      - PostgreSQL
    used_by:
      - bootstrap
      - ingestion
      - source service
    invariants:
      enforced:
        - structured snapshot rows are snapshot-scoped and deterministic entity IDs are used.
      required_but_not_fully_enforced:
        - governance/context/runtime/audit state stored in cce_control
    known_gaps:
      - Governance/context/runtime/audit migrations contain schemas only.
      - PostgresCheckpointRepository is not implemented.
      - The local index requires the pgvector extension when CCE_INDEX_BACKEND=local.
    related_docs:
      - backend/src/cce/persistence/AGENTS.md
      - docs/decisions/ADR-002-cce-control-postgres.md

  security:
    path: backend/src/cce/security
    purpose: >
      Resolve secret references and define DLP, entitlement and role boundaries.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/security/credentials.py:load_credential
        - backend/src/cce/security/credentials.py:load_snowflake_keypair_credential
      important_components:
        - backend/src/cce/security/dlp.py:classify_text
        - backend/src/cce/security/entitlements.py:assert_entitled
        - backend/src/cce/security/roles.py:has_role
      owns:
        - secret reference resolution
        - security policy boundaries
    inputs:
      - env:// or azure-kv:// credential references
    outputs:
      - resolved credential values
      - allow/deny helper decisions
    depends_on:
      - Azure Identity/Key Vault SDK
    used_by:
      - Snowflake connector
      - ingestion DLP nodes
    invariants:
      enforced:
        - credential resolver supports env and Azure Key Vault references
      required_but_not_fully_enforced:
        - real DLP/PII classification and redaction
        - entitlements at retrieval
        - authenticated/authorized API calls
    known_gaps:
      - DLP always reports PUBLIC and redaction is no-op.
      - Snowflake/Azure Blob environment builders do not consistently dereference nested azure-kv:// values.
      - role/entitlement helpers have no active API/runtime consumers.
    related_docs:
      - backend/src/cce/security/AGENTS.md

  governance:
    path: backend/src/cce/governance
    purpose: >
      Target proposal/review/approval lifecycle and approved-only policy boundary.
    status: planned
    implementation:
      entrypoints:
        - backend/src/cce/governance/service.py:GovernanceService
      important_components:
        - backend/src/cce/governance/state_machine.py:can_transition
        - backend/src/cce/governance/policy.py:require_approved
      owns:
        - target human approval lifecycle
    inputs:
      - proposed context assets
    outputs:
      - target approved/rejected decisions
    depends_on: []
    used_by:
      - RPC/HTTP adapters call placeholder service
      - context package builder imports approval helper
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - machines propose; humans approve
        - approved-only assets cross the serving boundary
    known_gaps:
      - Service returns empty/NOT_FOUND data.
      - No governance repository/tables beyond CREATE SCHEMA.
      - State-machine and policy helpers are not part of a live lifecycle.
    related_docs:
      - backend/src/cce/governance/AGENTS.md

  context_packages:
    path: backend/src/cce/context_packages
    purpose: >
      Target versioned domain package composition, scope, inheritance and governed assets.
    status: planned
    implementation:
      entrypoints:
        - backend/src/cce/context_packages/service.py:ContextPackageService
      important_components:
        - backend/src/cce/context_packages/builder.py:assert_assets_approved
        - backend/src/cce/context_packages/versioning.py:next_patch_version
        - backend/src/cce/context_packages/inheritance.py:resolve_overrides
      owns:
        - target package assembly and versioning
    inputs:
      - target approved assets
    outputs:
      - target domain context packages
    depends_on:
      - governance.policy
    used_by:
      - RPC/HTTP adapters call placeholder service
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - package contains approved assets only
        - package versions are immutable/auditable
        - domain/package isolation and override precedence
    known_gaps:
      - No persistent package store or functional service.
      - Helper functions are disconnected from an execution path.
    related_docs:
      - backend/src/cce/context_packages/AGENTS.md

  runtime:
    path: backend/src/cce/runtime
    purpose: >
      Target business-question resolution, governed context assembly, guarded live SQL and Context OFF/ON proof.
    status: planned
    implementation:
      entrypoints:
        - backend/src/cce/runtime/service.py:QueryService.query
        - backend/src/cce/runtime/orchestrator.py:RuntimeOrchestrator.run
      important_components:
        - backend/src/cce/runtime/sql_guard.py:enforce_select_only
        - backend/src/cce/runtime/retrieval.py:retrieve_evidence
      owns:
        - target query reasoning and proof flow
    inputs:
      - QueryRequest
    outputs:
      - QueryResponse
    depends_on:
      - integrations.agentic_plane
    used_by:
      - gRPC query handler
      - HTTP query adapter
      - MCP query helper
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - approved-only context
        - SELECT-only timeout/row-capped execution
        - Context OFF vs ON comparison
        - explain applied context
    known_gaps:
      - QueryService returns a fixed not-implemented answer.
      - Intent/resolvers/assembler/proof return placeholder values.
      - SQL generator/executor raise NotImplementedError.
      - SQL guard is prefix-only and disconnected.
    related_docs:
      - backend/src/cce/runtime/AGENTS.md

  traceability:
    path: backend/src/cce/traceability
    purpose: >
      Target answer/governance lineage and audit records distinct from engineering telemetry.
    status: planned
    implementation:
      entrypoints:
        - backend/src/cce/traceability/service.py:TraceabilityService.record
      important_components:
        - backend/src/cce/traceability/models.py:TraceEvent
      owns:
        - target answer/governance traceability
    inputs:
      - target lifecycle/query events
    outputs:
      - target audit trace
    depends_on: []
    used_by: []
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - answer carries trace ID, rule/package version, approver, validity, SQL and source provenance
    known_gaps:
      - record() returns its input and persists nothing.
      - audit migration is schema-only.
    related_docs:
      - backend/src/cce/traceability/AGENTS.md

  mcp:
    path: backend/src/cce/mcp
    purpose: >
      Target MCP transport over the same governed query runtime.
    status: planned
    implementation:
      entrypoints:
        - backend/src/cce/mcp/server.py:create_mcp_server
        - backend/src/cce/mcp/tools/query.py:query
      important_components: []
      owns:
        - target MCP tool exposure only
    inputs:
      - target external agent questions/tool calls
    outputs:
      - target governed CCE responses
    depends_on:
      - runtime.service
    used_by: []
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - MCP cannot bypass governance
        - MCP and other transports use the same runtime
    known_gaps:
      - create_mcp_server returns a dict rather than an MCP protocol server.
      - Runtime itself is not implemented.
    related_docs:
      - backend/src/cce/mcp/AGENTS.md

  integrations:
    path: backend/src/cce/integrations
    purpose: >
      Isolate external AgenticPlane and LLM implementations from CCE core logic.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/integrations/llm/client.py:complete
        - backend/src/cce/integrations/agentic_plane/local_index.py:LocalIndexClient
        - backend/src/cce/integrations/agentic_plane/client.py:AgenticPlaneClient.index
        - backend/src/cce/integrations/agentic_plane/client.py:AgenticPlaneClient.search
        - backend/src/cce/integrations/agentic_plane/client.py:AgenticPlaneClient.delete
        - backend/src/cce/integrations/agentic_plane/client.py:AgenticPlaneClient.graph
      important_components:
        - backend/src/cce/integrations/agentic_plane/base.py:AgenticPlaneBoundary
        - backend/src/cce/integrations/agentic_plane/bridge.py:AgenticPlaneMemoryBridge
        - backend/src/cce/integrations/agentic_plane/chunking.py:payload_chunks
      owns:
        - external SDK/model adapter boundary
    inputs:
      - prompts
      - retrieval questions
    outputs:
      - LLM text
      - retrieval/search results
      - index operation results
      - synchronous graph extraction and GraphRAG results
    depends_on:
      - Google Gemini LangChain package
      - pgvector when local indexing is enabled
      - AgenticPlane Python SDK when hosted indexing is enabled
      - cce_agentic_plane_memory bridge table
      - AgenticPlane GRAPH_ENABLED=true and ArcadeDB for hosted graph operations
    used_by:
      - source service uses the configured index boundary for ingestion writes
      - retrieval service uses the configured boundary for raw search and graph reads
      - runtime.retrieval has a legacy adapter-specific seam but no active governed read path
    invariants:
      enforced:
        - Gemini temperature is set to zero
        - local indexing/search stays behind the AgenticPlane boundary
        - hosted writes send raw text for server-side embedding
        - hosted memory IDs are retained in the CCE-owned bridge table
        - hosted graph extraction is synchronous per memory and links the returned memory ID
        - graph failures surface as ingestion errors
        - search scores use cosine similarity, with higher values ranked better
      required_but_not_fully_enforced:
        - AgenticPlane accessed only through adapter
        - runtime uses the configured LLM where agentic reasoning is required
    known_gaps:
      - The governed runtime read/context-assembly path is not wired to boundary search.
      - LocalIndexClient implements exact vector search only, not ANN indexing or graph operations; graph calls raise GraphNotSupportedError and raw retrieval marks them unsupported.
      - Gemini client has no production call site.
    related_docs:
      - backend/src/cce/integrations/AGENTS.md
      - docs/decisions/ADR-003-agentic-plane-boundary.md

  retrieval:
    path: backend/src/cce/retrieval
    purpose: >
      Provide a raw, non-governed memory plus GraphRAG retrieval proof over the configured index boundary.
    status: implemented
    implementation:
      entrypoints:
        - backend/src/cce/retrieval/service.py:RetrievalService.retrieve
        - backend/src/cce/http/app.py:POST /retrieve
        - backend/proto/cce/v1/retrieval.proto:RetrievalService.Retrieve
    owns:
      - raw retrieval request trace IDs
      - direct boundary-result response mapping
    inputs:
      - natural-language question
      - result limit and graph depth
    outputs:
      - memory records with provenance
      - GraphRAG entities, relationships and memory references
    depends_on:
      - integrations.agentic_plane boundary
    used_by:
      - HTTP and gRPC transport adapters
    invariants:
      enforced:
        - no answer synthesis or provider-result paraphrasing
        - local graph absence is explicitly marked unsupported
        - no dependency on QueryService, governance or context packages
      required_but_not_fully_enforced:
        - transport authentication and authorization
    known_gaps:
      - This proof is deliberately outside the governed Context ON/OFF runtime.
      - Hosted graph availability is deployment-controlled by AgenticPlane GRAPH_ENABLED and ArcadeDB.

  skills:
    path: backend/skills
    purpose: >
      Store versioned reasoning procedures and deterministic helper/reference assets.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/skills/loader.py:load_skill_function
        - backend/src/cce/skills/loader.py:load_skill_module
      important_components:
        - backend/skills/context_resolution/SKILL.md
        - backend/skills/entity_resolution/SKILL.md
        - backend/skills/policy_interpretation/SKILL.md
        - backend/skills/semantic_mapping/SKILL.md
        - backend/skills/sql_generation/SKILL.md
      owns:
        - agent skill assets
    inputs: []
    outputs:
      - dynamically loaded helper modules when explicitly called
    depends_on: []
    used_by:
      - tests only for current loader usage
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - agentic reasoning uses versioned skills rather than hardcoded domain prompts
    known_gaps:
      - No production runtime invokes the skill loader.
      - Loader comments/examples reference older skill directory names not present under backend/skills.
    related_docs:
      - backend/skills/AGENTS.md

  observability:
    path: backend/src/cce/observability
    purpose: >
      Engineering diagnostics separate from governance/audit semantics.
    status: partial
    implementation:
      entrypoints:
        - backend/src/cce/observability/logging.py:configure_logging
      important_components:
        - backend/src/cce/observability/metrics.py:increment
        - backend/src/cce/observability/tracing.py:current_span
      owns:
        - engineering logging/metrics/traces
    inputs: []
    outputs:
      - logging configuration
    depends_on: []
    used_by: []
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - observability remains separate from governance traceability
    known_gaps:
      - metrics and tracing helpers are no-ops.
      - no verified production wiring to configure_logging.
    related_docs:
      - backend/src/cce/observability/AGENTS.md

  frontend:
    path: frontend
    purpose: >
      Target analyst proof and stewardship UI.
    status: planned
    implementation:
      entrypoints: []
      important_components:
        - frontend/README.md
      owns:
        - target browser UI
    inputs:
      - target backend JSON API
    outputs:
      - target UI
    depends_on:
      - HTTP adapter
    used_by:
      - human users
    invariants:
      enforced: []
      required_but_not_fully_enforced:
        - show OFF/ON proof and traceability
        - steward review/approval UI
    known_gaps:
      - No frontend application code exists in the repository.
    related_docs:
      - frontend/AGENTS.md
