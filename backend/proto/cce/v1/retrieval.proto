syntax = "proto3";

package cce.v1;

import "google/protobuf/struct.proto";

service RetrievalService {
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}

message RetrieveRequest {
  string question = 1;
  int32 limit = 2;
  int32 graph_depth = 3;
}

message RetrievalProvenance {
  string document_id = 1;
  string source_id = 2;
  string object_id = 3;
  string trace_id = 4;
  string source_ref = 5;
  string version = 6;
}

message RetrievedMemory {
  string memory_id = 1;
  string content = 2;
  double score = 3;
  RetrievalProvenance provenance = 4;
  google.protobuf.Struct metadata = 5;
}

message GraphEntity {
  string entity_id = 1;
  string name = 2;
  string entity_type = 3;
  string description = 4;
  repeated string source_memories = 5;
  google.protobuf.Struct properties = 6;
  string project_id = 7;
  string created_at = 8;
  string updated_at = 9;
}

message GraphRelationship {
  string relationship_id = 1;
  string source_entity_id = 2;
  string target_entity_id = 3;
  string relation_type = 4;
  string description = 5;
  double weight = 6;
  string created_at = 7;
}

message GraphMemory {
  string memory_id = 1;
  string content = 2;
  double score = 3;
}

message GraphPayload {
  repeated GraphEntity entities = 1;
  repeated GraphRelationship relationships = 2;
  repeated GraphMemory memories = 3;
  bool unsupported = 4;
  string backend = 5;
  string reason = 6;
}

message RetrieveResponse {
  string trace_id = 1;
  string question = 2;
  string backend = 3;
  repeated RetrievedMemory memories = 4;
  GraphPayload graph = 5;
}
