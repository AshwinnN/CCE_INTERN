syntax = "proto3";

package cce.v1;

import "cce/v1/common.proto";

service QueryService {
  rpc Query(QueryRequest) returns (QueryResponse);
}

message QueryRequest {
  string question = 1;
  Actor actor = 2;
  bool context_enabled = 3;
}

message QueryResponse {
  string answer = 1;
  string trace_id = 2;
  repeated Provenance citations = 3;
  bool context_used = 4;
  Error error = 5;
  string applied_rule = 6;
  string package_id = 7;
  string package_version = 8;
  string executed_sql = 9;
  string approver = 10;
  string valid_until = 11;
  double confidence = 12;
}

message ContextComparison {
  QueryResponse off = 1;
  QueryResponse on = 2;
  string differs_because = 3;
}
