syntax = "proto3";

package cce.v1;

import "cce/v1/common.proto";
import "google/protobuf/struct.proto";

service QueryService {
  rpc Query(QueryRequest) returns (QueryResponse);
}

message QueryRequest {
  string question = 1;
  Actor actor = 2;
  optional bool context_enabled = 3;
  optional string domain_id = 4;
}

message QueryResponse {
  string answer = 1;
  string trace_id = 2;
  repeated Provenance citations = 3;
  bool context_used = 4;
  Error error = 5;
  string applied_rule = 6;
  string package_id = 7;
  string package_version = 8;
  string executed_sql = 9;
  string approver = 10;
  string valid_until = 11;
  double confidence = 12;
  string question = 13;
  google.protobuf.Struct domain = 14;
  google.protobuf.Struct package = 15;
  QueryBranchResult context_on = 16;
  QueryBranchResult context_off = 17;
  ProofResult proof = 18;
  repeated google.protobuf.Struct errors = 19;
}

message ContextComparison {
  QueryResponse off = 1;
  QueryResponse on = 2;
  string differs_because = 3;
}

message QueryBranchResult {
  string status = 1;
  optional string error_code = 2;
  optional string message = 3;
  optional string answer = 4;
  optional string sql = 5;
  repeated google.protobuf.Struct sql_attempts = 6;
  repeated google.protobuf.Struct rows = 7;
  repeated google.protobuf.Struct citations = 8;
  repeated google.protobuf.Struct context_used = 9;
  repeated string warnings = 10;
}
message ProofResult {
  string classification = 1;
  string explanation = 2;
  bool comparable = 3;
}
