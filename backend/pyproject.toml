[project]
name = "cce-backend"
version = "0.1.0"
description = "CoStrategix Context Engine governed context server"
requires-python = ">=3.10"
dependencies = [
  "azure-core==1.41.0",
  "azure-storage-blob==12.30.1",
  "azure-storage-file-datalake==12.25.0",
  "cryptography==50.0.1",
  "python-dotenv==1.2.3",
  "snowflake-connector-python==4.7.2",
  "pydantic>=2.0.0",
  "python-magic-bin>=0.4.14; platform_system == 'Windows'",
  "python-magic>=0.4.27; platform_system != 'Windows'",
  "pypdfium2>=4.30.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "paddleocr>=2.7.0",
  "paddlepaddle>=2.6.0",
  "openpyxl>=3.1.2",
  "pandas>=2.0.0",
  "langgraph==1.2.11",
  "requests>=2.31.0",
  "psycopg2-binary>=2.9.9",
  "grpcio>=1.64.0",
  "grpcio-tools>=1.64.0",
  "protobuf>=5.27.0",
  "azure-identity>=1,<2",
  "azure-keyvault-secrets>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langchain-google-genai>=2,<3",
  "langchain-openai>=1,<2",
  "agenticplane>=1.2.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
