services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cce_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cce_control}
    volumes:
      - cce_control_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:?Set PIP_EXTRA_INDEX_URL in .env}
    image: ${CCE_BACKEND_IMAGE:-cce-backend:local}
    env_file:
      - backend/.env
    environment:
      CCE_GRPC_HOST: 0.0.0.0
      CCE_HTTP_PORT: 8080
      CCE_CONTROL_DATABASE_URL: postgresql://${POSTGRES_USER:-cce_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cce_control}
      CCE_MIGRATE_ON_STARTUP: "true"
      CCE_MIGRATION_DIR: /app/backend/migrations/cce_control
      CCE_CHECKPOINT_STORE_PATH: /app/.ingestion_checkpoints
    ports:
      - "${CCE_GRPC_PORT:-50051}:50051"
      - "${CCE_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cce_ingestion_checkpoints:/app/.ingestion_checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  cce_control_postgres_data:
  cce_ingestion_checkpoints:
