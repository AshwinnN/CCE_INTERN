services:
  postgres:
    container_name: cce-demo-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: cce_admin
      POSTGRES_PASSWORD: cce_password
      POSTGRES_DB: cce_metadata
    ports:
      - "5434:5432"
    volumes:
      - cce_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cce_admin -d cce_metadata"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  cce_demo_postgres_data:
