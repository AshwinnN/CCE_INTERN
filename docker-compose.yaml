services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: cce_admin
      POSTGRES_PASSWORD: cce_password
      POSTGRES_DB: cce_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cce_admin -d cce_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
