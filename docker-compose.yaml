services:
  postgres:
    container_name: cce-control-postgres
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cce_admin
      POSTGRES_PASSWORD: cce_password
      POSTGRES_DB: cce_control
    ports:
      - "5434:5432"
    volumes:
      - cce_control_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cce_admin -d cce_control"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backend:
    container_name: cce-backend
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    env_file:
      - backend/.env
    environment:
      CCE_GRPC_HOST: 0.0.0.0
      CCE_CONTROL_DATABASE_URL: postgresql://cce_admin:cce_password@postgres:5432/cce_control
      CCE_MIGRATE_ON_STARTUP: "true"
      CCE_MIGRATION_DIR: /app/backend/migrations/cce_control
      CCE_POSTGRES_WAIT_TIMEOUT_SECONDS: "60"
      CCE_CHECKPOINT_STORE_PATH: /app/.ingestion_checkpoints
    ports:
      - "${CCE_GRPC_PORT:-50051}:${CCE_GRPC_PORT:-50051}"
      - "${CCE_HTTP_PORT:-8081}:${CCE_HTTP_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cce_ingestion_checkpoints:/app/.ingestion_checkpoints

volumes:
  cce_control_postgres_data:
  cce_ingestion_checkpoints:
